<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC3DC"/><stop offset=".5" stop-color="#F581AF"/>
      <stop offset=".52" stop-color="#E96599"/><stop offset="1" stop-color="#FFA8CB"/>
    </linearGradient>
    <g id="p"><ellipse cx="50" cy="23" rx="13" ry="22"/></g>
  </defs>
  <!-- 1. le contour decoupe, autour de la reunion des petales -->
  <g stroke="#fff" stroke-width="12" fill="none">
    <use href="#p"/><use href="#p" transform="rotate(60 50 50)"/>
    <use href="#p" transform="rotate(120 50 50)"/><use href="#p" transform="rotate(180 50 50)"/>
    <use href="#p" transform="rotate(240 50 50)"/><use href="#p" transform="rotate(300 50 50)"/>
  </g>
  <!-- 2. les petales, avec un filet blanc chacun : sans lui ils se confondent
       en un hexagone, ce qui etait le defaut du premier essai. -->
  <g fill="url(#g)" stroke="#fff" stroke-width="2.5">
    <use href="#p"/><use href="#p" transform="rotate(60 50 50)"/>
    <use href="#p" transform="rotate(120 50 50)"/><use href="#p" transform="rotate(180 50 50)"/>
    <use href="#p" transform="rotate(240 50 50)"/><use href="#p" transform="rotate(300 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="14" fill="#FFC93D" stroke="#fff" stroke-width="2.5"/>
  <ellipse cx="47" cy="45" rx="7" ry="4" fill="#fff" opacity=".55"/>
</svg>
